<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Lost in Orbit | PayrollPro</title>
     
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
          
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090e17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

         
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
            animation: orb-pulse 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #2dd4bf;
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #1e3a8a;
            bottom: -150px;
            right: -150px;
            animation-delay: -4s;
        }

        @keyframes orb-pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.15; }
            100% { transform: scale(1.15) translate(30px, -20px); opacity: 0.25; }
        }

         
        .error-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            max-width: 700px;
            width: 100%;
        }

         
        .error-graphic-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float-icon 4s ease-in-out infinite;
        }

        .graphic-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px dashed rgba(45, 212, 191, 0.4);
            animation: spin-slow 20s linear infinite;
        }

        .graphic-inner {
            width: 80px;
            height: 80px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(45, 212, 191, 0.4);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: #2dd4bf;
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.2);
        }

        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

         
        .error-code {
            font-size: clamp(6rem, 15vw, 9.5rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -4px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 30%, #2dd4bf 70%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: text-float 5s ease-in-out infinite;
        }

        @keyframes text-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

         
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 15px;
        }

        .error-desc {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            color: #94a3b8;
            line-height: 1.7;
            max-width: 520px;
            margin: 0 auto 40px auto;
        }

         
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            outline: none;
        }

         
        .btn-home {
            background: linear-gradient(135deg, #0d9488, #2dd4bf);
            color: #090e17;
            box-shadow: 0 10px 25px rgba(45, 212, 191, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 35px rgba(45, 212, 191, 0.5);
            background: #ffffff;
        }

         
        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .btn-back:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn:active {
            transform: scale(0.96);
        }

         
        .error-status {
            margin-top: 50px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #64748b;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f43f5e;
            box-shadow: 0 0 10px #f43f5e;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

         
        @media screen and (max-width: 600px) {
            .error-actions {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
            }
            .error-container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

     
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="error-container">
         
        <div class="error-graphic-wrapper">
            <div class="graphic-ring"></div>
            <div class="graphic-inner">
                <i class="fa-solid fa-satellite-dish"></i>
            </div>
        </div>

         
        <h1 class="error-code">404</h1>

         
        <h2 class="error-title">Page Lost in the Financial Cosmos</h2>
        <p class="error-desc">
            The page you are looking for might have been moved, deleted, or never existed in this payroll ledger. Let’s get you back on track.
        </p>

         
        <div class="error-actions">
            <button class="btn btn-home" onclick="goHome()">
                <i class="fa-solid fa-house"></i>
                <span>Go to Home</span>
            </button>
            <button class="btn btn-back" onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Go Back</span>
            </button>
        </div>

     
    </div>

     
    <script>
 
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

 
        function goHome() {
            window.location.href = 'index.html'; // Change to '/' or your main home path if needed
        }
    </script>
</body>
</html>
